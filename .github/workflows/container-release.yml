name: Container release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Container version without a leading v
        required: true
        default: 0.2.2-local
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      ghcr-namespace: ${{ steps.release.outputs.ghcr_namespace }}
      source-sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve and validate release metadata
        id: release
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${DISPATCH_VERSION:-${RELEASE_TAG#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid container version: $version" >&2
            exit 1
          fi
          source_sha="${GITHUB_SHA}"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $source_sha" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "ghcr_namespace=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infrastructure/docker/go-api.Dockerfile
            target: api
            entrypoint: /usr/local/bin/pipeforge-api
          - image: scheduler
            dockerfile: infrastructure/docker/go-api.Dockerfile
            target: scheduler
            entrypoint: /usr/local/bin/pipeforge-scheduler
          - image: result-consumer
            dockerfile: infrastructure/docker/go-api.Dockerfile
            target: result-consumer
            entrypoint: /usr/local/bin/pipeforge-result-consumer
          - image: migrate
            dockerfile: infrastructure/docker/go-api.Dockerfile
            target: migrate
            entrypoint: /usr/local/bin/pipeforge-migrate
          - image: worker
            dockerfile: python/Dockerfile
            target: worker
            entrypoint: python -m pipeforge_worker
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/pipeforge-${{ matrix.image }}
      GHCR_IMAGE: ghcr.io/${{ needs.prepare.outputs.ghcr-namespace }}/pipeforge-${{ matrix.image }}
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=sha-${{ needs.prepare.outputs.source-sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source-sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Attest GHCR image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Scan published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image \
            --scanners vuln \
            --skip-version-check \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            "${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}"

      - name: Verify runtime metadata
        env:
          EXPECTED_ENTRYPOINT: ${{ matrix.entrypoint }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${GHCR_IMAGE}@${IMAGE_DIGEST}"
          user="$(docker image inspect --format '{{.Config.User}}' "${GHCR_IMAGE}@${IMAGE_DIGEST}")"
          entrypoint="$(docker image inspect --format '{{join .Config.Entrypoint " "}}' "${GHCR_IMAGE}@${IMAGE_DIGEST}")"
          test "$user" = "pipeforge"
          test "$entrypoint" = "$EXPECTED_ENTRYPOINT"

      - name: Record immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          mkdir -p container-digests
          printf '%s\n' \
            "image=${{ matrix.image }}" \
            "version=${VERSION}" \
            "source_sha=${{ needs.prepare.outputs.source-sha }}" \
            "digest=${IMAGE_DIGEST}" \
            "ghcr=${GHCR_IMAGE}@${IMAGE_DIGEST}" \
            "dockerhub=${DOCKERHUB_IMAGE}@${IMAGE_DIGEST}" \
            > "container-digests/${{ matrix.image }}.txt"
          cat "container-digests/${{ matrix.image }}.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-digest-${{ matrix.image }}
          path: container-digests/${{ matrix.image }}.txt
          if-no-files-found: error
          retention-days: 90
