name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  go-integration:
    name: Go integration checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: pipeforge_test
          POSTGRES_USER: pipeforge_test
          POSTGRES_PASSWORD: pipeforge_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeforge_test -d pipeforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:3.13.7-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pipeforge_test
          RABBITMQ_DEFAULT_PASS: pipeforge_test_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: go
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: pipeforge_test
      POSTGRES_USER: pipeforge_test
      POSTGRES_PASSWORD: pipeforge_test_password
      PIPEFORGE_TEST_DATABASE_URL: postgres://pipeforge_test:pipeforge_test_password@localhost:5432/pipeforge_test?sslmode=disable
      PIPEFORGE_TEST_RABBIT_URL: amqp://pipeforge_test:pipeforge_test_password@localhost:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache: true
      - name: Apply migrations
        run: go run ./cmd/migrate
      - name: PostgreSQL and RabbitMQ integration tests
        run: >-
          go test -count=1 -tags=integration
          ./internal/outbox
          ./internal/job
          ./internal/lease
          ./internal/result
          ./internal/workerregistry
          ./internal/queue

  python:
    name: Python checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install worker and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Format check
        run: python -m ruff format --check src tests
      - name: Type check
        run: python -m mypy src
      - name: Tests
        run: python -m pytest -q

  contracts:
    name: Contract and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract validator dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Validate contracts
        run: python scripts/validate-contracts.py
      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - name: Check whitespace errors
        run: git diff --check

  frontend:
    name: Console build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build console
        run: npm run build
