openapi: 3.0.3
info:
  title: PipeForge API
  version: 0.7.0-results
  description: >-
    Implemented HTTP contract for the Go control plane foundation, identity
    flows, immutable dataset metadata, presigned multipart sessions, idempotent processing jobs, owner-scoped data-quality rules, and canonical result artifacts.
servers:
  - url: http://localhost:58080
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: A required dependency is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /metrics:
    get:
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics.
          content:
            text/plain: {}
  /v1/auth/register:
    post:
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '201':
          description: User and initial token pair created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
  /v1/auth/login:
    post:
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '200':
          description: Authenticated user and token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/auth/refresh:
    post:
      operationId: rotateRefreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/auth/logout:
    post:
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh-token family revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /v1/api-keys:
    post:
      operationId: createApiKey
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created. The plaintext key is returned only in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAPIKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    get:
      operationId: listApiKeys
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: API key metadata without plaintext secrets.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/api-keys/{keyID}:
    delete:
      operationId: revokeApiKey
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: keyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: API key revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: API key does not belong to the authenticated owner.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/datasets:
    post:
      operationId: createDataset
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDatasetRequest'
      responses:
        '201':
          description: Dataset metadata created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: The owner already has an active dataset with this name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    get:
      operationId: listDatasets
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: state
          in: query
          schema:
            type: string
            enum: [REGISTERED, UPLOADING, AVAILABLE, PROCESSING, READY, FAILED, DELETED]
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Owner-scoped dataset page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/datasets/{datasetID}:
    parameters:
      - name: datasetID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getDataset
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Dataset metadata and immutable versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The dataset belongs to another owner.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Dataset not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: deleteDataset
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '204':
          description: Dataset soft-deleted.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The dataset belongs to another owner.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/datasets/{datasetID}/versions:
    parameters:
      - name: datasetID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Filename
        in: header
        required: true
        schema:
          type: string
          maxLength: 255
      - name: X-Checksum-SHA256
        in: header
        required: false
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
    post:
      operationId: uploadDatasetVersion
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/jsonl:
            schema:
              type: string
              format: binary
          application/vnd.apache.parquet:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Immutable dataset version stored and available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: The dataset belongs to another owner.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Upload exceeds the configured maximum size.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Object storage failed before metadata was committed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/datasets/{datasetVersionID}/jobs:
    parameters:
      - name: datasetVersionID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
    post:
      operationId: createProcessingJob
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Processing job created and queued through the transactional outbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '200':
          description: Existing job returned for an idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
  /api/v1/jobs:
    get:
      operationId: listProcessingJobs
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/JobState'
      responses:
        '200':
          description: Jobs visible to the authenticated owner or administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/jobs/{jobID}:
    parameters:
      - name: jobID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProcessingJob
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Job resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/jobs/{jobID}/cancel:
    parameters:
      - name: jobID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestJobCancellation
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelJobRequest'
      responses:
        '200':
          description: Queued jobs are cancelled immediately; leased/running jobs move to CANCEL_REQUESTED and complete after worker acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
  /api/v1/jobs/{jobID}/progress:
    get:
      operationId: getJobProgress
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Latest validated progress snapshot for the authorized job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSnapshot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/jobs/{jobID}/progress/history:
    get:
      operationId: listJobProgressHistory
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Capped, newest-first progress history for the authorized job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/jobs/{jobID}/retry:
    parameters:
      - name: jobID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestJobRetry
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Failed job re-queued with a new attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
  /api/v1/quality-rules:
    post:
      operationId: createQualityRule
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQualityRuleRequest'
      responses:
        '201':
          description: Owner-scoped quality rule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityRule'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
    get:
      operationId: listQualityRules
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: datasetId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Quality rules visible to the authenticated owner or administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityRuleListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/quality-rules/{ruleID}:
    parameters:
      - name: ruleID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getQualityRule
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: Quality rule resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityRule'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateQualityRule
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchQualityRuleRequest'
      responses:
        '200':
          description: Updated quality rule resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityRule'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
    delete:
      operationId: deleteQualityRule
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '204':
          description: Quality rule soft-deleted; repeated deletes return not found.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/datasets/{datasetID}/quality-rules:
    parameters:
      - name: datasetID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createDatasetQualityRule
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetQualityRuleRequest'
      responses:
        '201':
          description: Quality rule created for the path dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityRule'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
    get:
      operationId: listDatasetQualityRules
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Quality rules for the authorized dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityRuleListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/datasets/{datasetID}/uploads:
    post:
      operationId: initiateMultipartUpload
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: datasetID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateMultipartUploadRequest'
      responses:
        '201':
          description: Multipart upload session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipartUploadSession'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/UploadTooLarge'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '502':
          $ref: '#/components/responses/StorageError'
  /v1/uploads/{sessionID}:
    get:
      operationId: getMultipartUpload
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Upload session and registered parts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipartUploadSessionDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/uploads/{sessionID}/parts:
    get:
      operationId: listMultipartParts
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Registered multipart parts.
          content:
            application/json:
              schema:
                type: object
                required: [parts]
                properties:
                  parts:
                    type: array
                    items:
                      $ref: '#/components/schemas/MultipartUploadPart'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/uploads/{sessionID}/parts/{partNumber}/presign:
    post:
      operationId: presignMultipartPart
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: partNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Short-lived presigned URL for the part.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipartPartURL'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '502':
          $ref: '#/components/responses/StorageError'
  /v1/uploads/{sessionID}/parts/{partNumber}:
    put:
      operationId: registerMultipartPart
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: partNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMultipartPartRequest'
      responses:
        '200':
          description: Part metadata registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipartUploadPart'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '502':
          $ref: '#/components/responses/StorageError'
  /v1/uploads/{sessionID}/complete:
    post:
      operationId: completeMultipartUpload
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMultipartUploadRequest'
      responses:
        '201':
          description: Immutable dataset version promoted to available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '413':
          $ref: '#/components/responses/UploadTooLarge'
        '502':
          $ref: '#/components/responses/StorageError'
  /v1/uploads/{sessionID}/abort:
    post:
      operationId: abortMultipartUpload
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Upload session aborted; repeated aborts are safe.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '502':
          $ref: '#/components/responses/StorageError'
  /api/v1/artifacts:
    get:
      operationId: listArtifacts
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: jobId
          in: query
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          schema:
            type: string
            pattern: '^[a-z0-9_-]{1,64}$'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Canonical artifacts visible to the authenticated principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/jobs/{jobID}/artifacts:
    get:
      operationId: listJobArtifacts
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          schema:
            type: string
            pattern: '^[a-z0-9_-]{1,64}$'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Canonical artifacts for the authorized job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/artifacts/{artifactID}:
    get:
      operationId: getArtifact
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: artifactID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Canonical artifact metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/artifacts/{artifactID}/download:
    get:
      operationId: downloadArtifact
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: artifactID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Streamed canonical artifact. Range requests are intentionally unsupported.
          headers:
            Content-Length:
              schema:
                type: integer
                format: int64
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream: {}
            application/json: {}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/UploadTooLarge'
        '416':
          description: Range requests are not supported.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          $ref: '#/components/responses/StorageError'
  /api/v1/dead-letters:
    get:
      operationId: listDeadLetters
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: openOnly
          in: query
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Owner-scoped dead-letter records without raw stack traces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/dead-letters/{recordID}/replay:
    post:
      operationId: replayDeadLetter
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: recordID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dead-letter replay committed with a new attempt and outbox command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterReplayResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    InvalidRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Authentication is missing, invalid, expired, or revoked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated principal is not allowed to access the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ResourceConflict:
      description: The resource cannot be changed in its current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    QuotaExceeded:
      description: The owner has reached the bounded queued-job quota.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UploadTooLarge:
      description: The upload exceeds the configured maximum size.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StorageError:
      description: Object storage could not complete or verify the operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EmailAlreadyRegistered:
      description: The email is already registered.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CredentialsRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
    User:
      type: object
      required: [id, email, role, scopes]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, USER, SERVICE]
        scopes:
          type: array
          items:
            type: string
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    CreateAPIKeyRequest:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            type: string
    CreatedAPIKey:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [apiKey]
          properties:
            apiKey:
              type: string
              description: Plaintext API key; save it because it is not returned again.
    APIKey:
      type: object
      required: [id, name, prefix, scopes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
    CreateDatasetRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 2000
    Dataset:
      type: object
      required: [id, ownerUserId, name, description, state, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        state:
          type: string
          enum: [REGISTERED, UPLOADING, AVAILABLE, PROCESSING, READY, FAILED, DELETED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    DatasetVersion:
      type: object
      required: [id, datasetId, versionNumber, state, originalFilename, contentType, format, sourceInfo, artifactPrefix, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        datasetId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          format: int32
        state:
          type: string
          enum: [UPLOADING, AVAILABLE, FAILED]
        originalFilename:
          type: string
        contentType:
          type: string
        format:
          type: string
          enum: [CSV, JSONL, PARQUET]
        sizeBytes:
          type: integer
          format: int64
          nullable: true
        checksumSha256:
          type: string
          nullable: true
        rowCount:
          type: integer
          format: int64
          nullable: true
        columnCount:
          type: integer
          format: int32
          nullable: true
        encoding:
          type: string
          nullable: true
        compressionType:
          type: string
          nullable: true
        sourceInfo:
          type: object
          additionalProperties: true
        artifactPrefix:
          type: string
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        availableAt:
          type: string
          format: date-time
          nullable: true
    JobOperation:
      type: object
      required: [type, config]
      additionalProperties: false
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 64
          enum: [PROFILE_DATASET, CHECK_MISSING_VALUES, CHECK_DUPLICATES, VALIDATE_QUALITY, DETECT_OUTLIERS]
        config:
          type: object
          maxProperties: 32
          additionalProperties: true
    QualityRuleType:
      type: string
      enum: [NOT_NULL, UNIQUE, BETWEEN, MIN_LENGTH, MAX_LENGTH, REGEX, EMAIL_FORMAT, DATE_FORMAT, ALLOWED_VALUES, COLUMN_TYPE, ROW_COUNT_BETWEEN, REFERENTIAL_SET]
    QualitySeverity:
      type: string
      enum: [INFO, WARNING, ERROR, CRITICAL]
    QualityRuleConfiguration:
      type: object
      description: Strict rule-specific configuration. Arbitrary custom expressions are not supported.
      maxProperties: 4
      additionalProperties: true
    CreateQualityRuleRequest:
      type: object
      required: [datasetId, name, ruleType, severity]
      additionalProperties: false
      properties:
        datasetId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        columnScope:
          type: array
          maxItems: 256
          items:
            type: string
            pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
        ruleType:
          $ref: '#/components/schemas/QualityRuleType'
        configuration:
          $ref: '#/components/schemas/QualityRuleConfiguration'
        severity:
          $ref: '#/components/schemas/QualitySeverity'
        enabled:
          type: boolean
          default: true
    DatasetQualityRuleRequest:
      type: object
      description: The datasetId field is optional on the nested route and, when present, must match datasetID.
      required: [name, ruleType, severity]
      additionalProperties: false
      properties:
        datasetId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        columnScope:
          type: array
          maxItems: 256
          items:
            type: string
            pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
        ruleType:
          $ref: '#/components/schemas/QualityRuleType'
        configuration:
          $ref: '#/components/schemas/QualityRuleConfiguration'
        severity:
          $ref: '#/components/schemas/QualitySeverity'
        enabled:
          type: boolean
          default: true
    PatchQualityRuleRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        columnScope:
          type: array
          maxItems: 256
          items:
            type: string
            pattern: '^[A-Za-z_][A-Za-z0-9_]{0,127}$'
        ruleType:
          $ref: '#/components/schemas/QualityRuleType'
        configuration:
          $ref: '#/components/schemas/QualityRuleConfiguration'
        severity:
          $ref: '#/components/schemas/QualitySeverity'
        enabled:
          type: boolean
    QualityRule:
      type: object
      required: [id, ownerUserId, datasetId, name, columnScope, ruleType, configuration, severity, enabled, createdBy, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        datasetId:
          type: string
          format: uuid
        name:
          type: string
        columnScope:
          type: array
          items:
            type: string
        ruleType:
          $ref: '#/components/schemas/QualityRuleType'
        configuration:
          $ref: '#/components/schemas/QualityRuleConfiguration'
        severity:
          $ref: '#/components/schemas/QualitySeverity'
        enabled:
          type: boolean
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    QualityRuleListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QualityRule'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    CreateJobRequest:
      type: object
      required: [operations]
      additionalProperties: false
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/JobOperation'
        priority:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          default: 0
        maxAttempts:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
          default: 5
    CancelJobRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    JobState:
      type: string
      enum: [CREATED, QUEUED, LEASED, RUNNING, SUCCEEDED, FAILED_RETRYABLE, FAILED_PERMANENT, CANCEL_REQUESTED, CANCELLED, DEAD_LETTERED]
    Job:
      type: object
      required: [id, ownerUserId, datasetVersionId, state, operations, requestFingerprint, priority, maxAttempts, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        datasetVersionId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/JobState'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/JobOperation'
        requestFingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
        priority:
          type: integer
          format: int32
        maxAttempts:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        queuedAt:
          type: string
          format: date-time
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        cancelRequestedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        lastErrorCode:
          type: string
          nullable: true
    JobListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    ProgressSnapshot:
      type: object
      required: [jobId, attemptId, stage, processedRows, progressPercent, throughput, updatedAt, receivedAt]
      properties:
        jobId:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        stage:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        processedRows:
          type: integer
          format: int64
          minimum: 0
        estimatedTotalRows:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        progressPercent:
          type: number
          format: double
          minimum: 0
          maximum: 100
        throughput:
          type: number
          format: double
          minimum: 0
        updatedAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
    ProgressListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProgressSnapshot'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    Artifact:
      type: object
      required: [id, jobId, attemptId, kind, sizeBytes, contentType, checksumSha256, state, createdAt]
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        kind:
          type: string
          pattern: '^[a-z0-9_-]{1,64}$'
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        contentType:
          type: string
        checksumSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        state:
          type: string
          enum: [CANONICAL]
        createdAt:
          type: string
          format: date-time
    ArtifactListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    DeadLetter:
      type: object
      required: [id, jobId, attemptId, attemptNumber, errorCode, errorMessage, retryable, createdAt]
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        leaseId:
          type: string
          format: uuid
        workerId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
          minimum: 1
        errorCode:
          type: string
        errorMessage:
          type: string
        retryable:
          type: boolean
        diagnosticRef:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        replayedAt:
          type: string
          format: date-time
          nullable: true
        replayedBy:
          type: string
          format: uuid
          nullable: true
    DeadLetterListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeadLetter'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    DeadLetterReplayResponse:
      type: object
      required: [record, jobId, attemptId]
      properties:
        record:
          $ref: '#/components/schemas/DeadLetter'
        jobId:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
    DatasetListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
          format: int64
    DatasetDetailResponse:
      type: object
      required: [dataset, versions]
      properties:
        dataset:
          $ref: '#/components/schemas/Dataset'
        versions:
          type: array
          items:
            $ref: '#/components/schemas/DatasetVersion'
    InitiateMultipartUploadRequest:
      type: object
      required: [filename, expectedSize]
      additionalProperties: false
      properties:
        filename:
          type: string
          maxLength: 255
        contentType:
          type: string
          default: application/octet-stream
        expectedSize:
          type: integer
          format: int64
          minimum: 1
        expectedChecksumSha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
        idempotencyKey:
          type: string
          maxLength: 128
    MultipartUploadSession:
      type: object
      required: [id, ownerUserId, datasetId, versionId, state, originalFilename, contentType, format, expectedSize, partSize, partCount, expiresAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        ownerUserId:
          type: string
          format: uuid
        datasetId:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        state:
          type: string
          enum: [INITIATED, COMPLETING, ABORTING, COMPLETED, ABORTED, EXPIRED, FAILED]
        originalFilename:
          type: string
        contentType:
          type: string
        format:
          type: string
          enum: [CSV, JSONL, PARQUET]
        expectedSize:
          type: integer
          format: int64
        expectedChecksumSha256:
          type: string
          nullable: true
        partSize:
          type: integer
          format: int64
        partCount:
          type: integer
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        abortedAt:
          type: string
          format: date-time
          nullable: true
    MultipartUploadPart:
      type: object
      required: [sessionId, partNumber, etag, sizeBytes, createdAt]
      properties:
        sessionId:
          type: string
          format: uuid
        partNumber:
          type: integer
          minimum: 1
        etag:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
    MultipartUploadSessionDetail:
      type: object
      required: [session, parts]
      properties:
        session:
          $ref: '#/components/schemas/MultipartUploadSession'
        parts:
          type: array
          items:
            $ref: '#/components/schemas/MultipartUploadPart'
    MultipartPartURL:
      type: object
      required: [partNumber, url, method, expiresAt]
      properties:
        partNumber:
          type: integer
        url:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        expiresAt:
          type: string
          format: date-time
    RegisterMultipartPartRequest:
      type: object
      required: [etag, sizeBytes]
      additionalProperties: false
      properties:
        etag:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
    CompleteMultipartUploadRequest:
      type: object
      required: [parts]
      additionalProperties: false
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [partNumber, etag]
            additionalProperties: false
            properties:
              partNumber:
                type: integer
                minimum: 1
              etag:
                type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    Problem:
      type: object
      required: [statusCode, code, message, requestId]
      properties:
        statusCode:
          type: integer
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
