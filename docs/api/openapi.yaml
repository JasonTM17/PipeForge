openapi: 3.0.3
info:
  title: PipeForge API
  version: 0.2.0-identity
  description: >-
    Implemented HTTP contract for the Go control plane foundation and identity
    flows. Dataset and job resources are added only when implemented and tested.
servers:
  - url: http://localhost:58080
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: A required dependency is unavailable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /metrics:
    get:
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus metrics.
          content:
            text/plain: {}
  /v1/auth/register:
    post:
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '201':
          description: User and initial token pair created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
  /v1/auth/login:
    post:
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '200':
          description: Authenticated user and token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/auth/refresh:
    post:
      operationId: rotateRefreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/auth/logout:
    post:
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh-token family revoked.
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /v1/api-keys:
    post:
      operationId: createApiKey
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created. The plaintext key is returned only in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAPIKey'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    get:
      operationId: listApiKeys
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          description: API key metadata without plaintext secrets.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /v1/api-keys/{keyID}:
    delete:
      operationId: revokeApiKey
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: keyID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: API key revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: API key does not belong to the authenticated owner.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  responses:
    InvalidRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Authentication is missing, invalid, expired, or revoked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    EmailAlreadyRegistered:
      description: The email is already registered.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CredentialsRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
    User:
      type: object
      required: [id, email, role, scopes]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, USER, SERVICE]
        scopes:
          type: array
          items:
            type: string
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    CreateAPIKeyRequest:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            type: string
    CreatedAPIKey:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          required: [apiKey]
          properties:
            apiKey:
              type: string
              description: Plaintext API key; save it because it is not returned again.
    APIKey:
      type: object
      required: [id, name, prefix, scopes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready]
    Problem:
      type: object
      required: [statusCode, code, message, requestId]
      properties:
        statusCode:
          type: integer
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
