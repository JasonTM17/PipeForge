<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <style>
    text { font-family: 'Courier New', monospace; fill: #caf0f8; }
    .title { font-size: 25px; font-weight: 700; letter-spacing: .08em; }
    .label { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12px; fill: #90e0ef; }
    .group { fill: none; stroke: #00b4d8; stroke-width: 1; stroke-dasharray: 8 5; opacity: .72; }
    .node { fill: #0d1f3c; stroke: #00b4d8; stroke-width: 2; rx: 4; }
    .store { fill: #102846; stroke: #06d6a0; stroke-width: 2; }
    .edge { fill: none; stroke: #00b4d8; stroke-width: 2; marker-end: url(#arrow); }
    .event { fill: none; stroke: #90e0ef; stroke-width: 2; stroke-dasharray: 7 4; marker-end: url(#arrow-event); }
    .edge-label { font-size: 11px; fill: #48cae4; }
  </style>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#112240" stroke-width=".7"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#00b4d8"/></marker>
    <marker id="arrow-event" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5L0 7Z" fill="#90e0ef"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#0a1628"/><rect width="1200" height="720" fill="url(#grid)" opacity=".65"/>
  <text x="48" y="55" class="title">PIPEFORGE / LOCAL RUNTIME ARCHITECTURE</text>
  <text x="48" y="82" class="sub">PostgreSQL is authoritative; workers receive fenced commands and publish immutable attempt artifacts.</text>

  <rect x="35" y="120" width="190" height="165" class="group"/><text x="50" y="146" class="sub">CLIENTS</text>
  <rect x="60" y="175" width="140" height="58" class="node"/><text x="130" y="200" text-anchor="middle" class="label">Console</text><text x="130" y="220" text-anchor="middle" class="sub">React / Vite</text>
  <rect x="60" y="245" width="140" height="26" class="node"/><text x="130" y="263" text-anchor="middle" class="sub">pipectl / HTTP</text>

  <rect x="265" y="120" width="210" height="165" class="group"/><text x="280" y="146" class="sub">CONTROL PLANE</text>
  <rect x="290" y="175" width="160" height="58" class="node"/><text x="370" y="200" text-anchor="middle" class="label">Go API</text><text x="370" y="220" text-anchor="middle" class="sub">auth / uploads / jobs</text>
  <rect x="290" y="245" width="160" height="26" class="node"/><text x="370" y="263" text-anchor="middle" class="sub">Scheduler + leases</text>

  <rect x="515" y="120" width="210" height="165" class="group"/><text x="530" y="146" class="sub">DATA PLANE</text>
  <rect x="540" y="175" width="160" height="58" class="node"/><text x="620" y="200" text-anchor="middle" class="label">Python worker</text><text x="620" y="220" text-anchor="middle" class="sub">Polars / Arrow pipeline</text>
  <rect x="540" y="245" width="160" height="26" class="node"/><text x="620" y="263" text-anchor="middle" class="sub">bounded progress</text>

  <rect x="765" y="120" width="190" height="165" class="group"/><text x="780" y="146" class="sub">RESULT PLANE</text>
  <rect x="790" y="175" width="140" height="58" class="node"/><text x="860" y="200" text-anchor="middle" class="label">Result consumer</text><text x="860" y="220" text-anchor="middle" class="sub">inbox / projection</text>
  <rect x="790" y="245" width="140" height="26" class="node"/><text x="860" y="263" text-anchor="middle" class="sub">canonical artifacts</text>

  <rect x="995" y="120" width="170" height="165" class="group"/><text x="1010" y="146" class="sub">TRANSPORT</text>
  <rect x="1020" y="190" width="120" height="58" class="store"/><text x="1080" y="215" text-anchor="middle" class="label">RabbitMQ</text><text x="1080" y="235" text-anchor="middle" class="sub">events / commands</text>

  <path d="M200 204H290" class="edge"/><text x="245" y="194" text-anchor="middle" class="edge-label">HTTP</text>
  <path d="M450 204H540" class="edge"/><text x="495" y="194" text-anchor="middle" class="edge-label">fenced job</text>
  <path d="M700 204H790" class="event"/><text x="745" y="194" text-anchor="middle" class="edge-label">outcomes</text>
  <path d="M930 204H1020" class="event"/><text x="975" y="194" text-anchor="middle" class="edge-label">AMQP</text>
  <path d="M370 271V370H160V470" class="edge"/><path d="M620 271V470" class="edge"/><path d="M860 271V370H1040V470" class="edge"/>

  <rect x="35" y="425" width="250" height="170" class="group"/><text x="50" y="451" class="sub">AUTHORITATIVE METADATA</text>
  <path d="M85 485h150v75H85z" class="store"/><text x="160" y="518" text-anchor="middle" class="label">PostgreSQL</text><text x="160" y="540" text-anchor="middle" class="sub">jobs / leases / inbox</text>
  <rect x="315" y="425" width="250" height="170" class="group"/><text x="330" y="451" class="sub">SOURCE OBJECTS</text>
  <path d="M365 485h150v75H365z" class="store"/><text x="440" y="518" text-anchor="middle" class="label">MinIO datasets</text><text x="440" y="540" text-anchor="middle" class="sub">immutable versions</text>
  <rect x="595" y="425" width="250" height="170" class="group"/><text x="610" y="451" class="sub">REPORT OBJECTS</text>
  <path d="M645 485h150v75H645z" class="store"/><text x="720" y="518" text-anchor="middle" class="label">MinIO artifacts</text><text x="720" y="540" text-anchor="middle" class="sub">attempt-scoped JSON</text>
  <rect x="875" y="425" width="290" height="170" class="group"/><text x="890" y="451" class="sub">SAFETY INVARIANTS</text><text x="895" y="488" class="sub">• no raw rows in broker payloads</text><text x="895" y="515" class="sub">• lease + attempt fencing</text><text x="895" y="542" class="sub">• owner-scoped reads</text><text x="895" y="569" class="sub">• bounded retries + DLQs</text>

  <rect x="900" y="640" width="265" height="55" fill="#0d1f3c" stroke="#00b4d8"/><line x1="900" y1="658" x2="1165" y2="658" stroke="#00b4d8"/><text x="1032" y="653" text-anchor="middle" class="sub">PIPEFORGE / ARCHITECTURE</text><text x="1032" y="682" text-anchor="middle" class="label">LOCAL LEARNING RELEASE</text>
</svg>
