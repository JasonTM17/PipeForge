name: pipeforge

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pipeforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - pipeforge-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  rabbitmq-init:
    image: rabbitmq:3.13.7-management-alpine
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - ./infrastructure/rabbitmq/definitions.json:/opt/pipeforge/definitions.json:ro
      - ./infrastructure/rabbitmq/init.sh:/opt/pipeforge/init.sh:ro
    entrypoint: ["/bin/sh", "/opt/pipeforge/init.sh"]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - pipeforge-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-16T15-35-03Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_DATASET_BUCKET: ${MINIO_DATASET_BUCKET:-datasets}
    volumes:
      - ./infrastructure/minio/init.sh:/opt/pipeforge/init.sh:ro
    entrypoint: ["/bin/sh", "/opt/pipeforge/init.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/go-api.Dockerfile
    environment:
      PIPEFORGE_ENV: ${PIPEFORGE_ENV:-development}
      PIPEFORGE_LOG_LEVEL: ${PIPEFORGE_LOG_LEVEL:-info}
      PIPEFORGE_HTTP_ADDR: ":8080"
      PIPEFORGE_DATABASE_MAX_CONNS: ${PIPEFORGE_DATABASE_MAX_CONNS:-10}
      PIPEFORGE_SHUTDOWN_TIMEOUT: ${PIPEFORGE_SHUTDOWN_TIMEOUT:-10s}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      PIPEFORGE_ACCESS_TOKEN_TTL: ${PIPEFORGE_ACCESS_TOKEN_TTL:-15m}
      PIPEFORGE_REFRESH_TOKEN_TTL: ${PIPEFORGE_REFRESH_TOKEN_TTL:-720h}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
      MINIO_DATASET_BUCKET: ${MINIO_DATASET_BUCKET:-datasets}
      PIPEFORGE_MAX_UPLOAD_BYTES: ${PIPEFORGE_MAX_UPLOAD_BYTES:-67108864}
      PIPEFORGE_MULTIPART_PART_SIZE: ${PIPEFORGE_MULTIPART_PART_SIZE:-8388608}
      PIPEFORGE_MULTIPART_MAX_PARTS: ${PIPEFORGE_MULTIPART_MAX_PARTS:-10000}
      PIPEFORGE_MULTIPART_MAX_BYTES: ${PIPEFORGE_MULTIPART_MAX_BYTES:-5368709120}
      PIPEFORGE_MULTIPART_SESSION_TTL: ${PIPEFORGE_MULTIPART_SESSION_TTL:-24h}
      PIPEFORGE_MULTIPART_URL_TTL: ${PIPEFORGE_MULTIPART_URL_TTL:-15m}
      PIPEFORGE_MULTIPART_COMPLETION_GRACE: ${PIPEFORGE_MULTIPART_COMPLETION_GRACE:-1h}
      PIPEFORGE_MULTIPART_CLEANUP_LIMIT: ${PIPEFORGE_MULTIPART_CLEANUP_LIMIT:-100}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${PIPEFORGE_API_PORT:-58080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: python/Dockerfile
    profiles: [worker]
    environment:
      PIPEFORGE_WORKER_ENV: ${PIPEFORGE_ENV:-development}
      PIPEFORGE_WORKER_LOG_LEVEL: ${PIPEFORGE_LOG_LEVEL:-info}
      PIPEFORGE_WORKER_BROKER_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672/
      PIPEFORGE_WORKER_QUEUE: ${PIPEFORGE_WORKER_QUEUE:-processing.jobs}
      PIPEFORGE_WORKER_COMMANDS_EXCHANGE: ${PIPEFORGE_WORKER_COMMANDS_EXCHANGE:-pipeforge.commands}
      PIPEFORGE_WORKER_EVENTS_EXCHANGE: ${PIPEFORGE_WORKER_EVENTS_EXCHANGE:-pipeforge.events}
      PIPEFORGE_WORKER_MAX_CONCURRENCY: ${PIPEFORGE_WORKER_MAX_CONCURRENCY:-2}
      PIPEFORGE_WORKER_PREFETCH: ${PIPEFORGE_WORKER_PREFETCH:-2}
      PIPEFORGE_WORKER_HEARTBEAT_INTERVAL: ${PIPEFORGE_WORKER_HEARTBEAT_INTERVAL:-15}
      PIPEFORGE_WORKER_HEALTH_ONLY: ${PIPEFORGE_WORKER_HEALTH_ONLY:-true}
      PIPEFORGE_WORKER_HEALTH_HOST: 0.0.0.0
      PIPEFORGE_WORKER_HEALTH_PORT: 8090
      PIPEFORGE_WORKER_MINIO_ENDPOINT: minio:9000
      PIPEFORGE_WORKER_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      PIPEFORGE_WORKER_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      PIPEFORGE_WORKER_MINIO_SECURE: ${MINIO_SECURE:-false}
      PIPEFORGE_WORKER_DATASET_BUCKET: ${MINIO_DATASET_BUCKET:-datasets}
      PIPEFORGE_CONTRACTS_DIR: /opt/pipeforge/contracts/json-schema
    ports:
      - "${PIPEFORGE_WORKER_PORT:-58090}:8090"
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/go-api.Dockerfile
    profiles: [jobs]
    entrypoint: ["/usr/local/bin/pipeforge-scheduler"]
    environment:
      PIPEFORGE_ENV: ${PIPEFORGE_ENV:-development}
      PIPEFORGE_LOG_LEVEL: ${PIPEFORGE_LOG_LEVEL:-info}
      PIPEFORGE_DATABASE_MAX_CONNS: ${PIPEFORGE_DATABASE_MAX_CONNS:-10}
      PIPEFORGE_SHUTDOWN_TIMEOUT: ${PIPEFORGE_SHUTDOWN_TIMEOUT:-10s}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
      MINIO_DATASET_BUCKET: ${MINIO_DATASET_BUCKET:-datasets}
      PIPEFORGE_MULTIPART_PART_SIZE: ${PIPEFORGE_MULTIPART_PART_SIZE:-8388608}
      PIPEFORGE_MULTIPART_MAX_PARTS: ${PIPEFORGE_MULTIPART_MAX_PARTS:-10000}
      PIPEFORGE_MULTIPART_MAX_BYTES: ${PIPEFORGE_MULTIPART_MAX_BYTES:-5368709120}
      PIPEFORGE_MULTIPART_SESSION_TTL: ${PIPEFORGE_MULTIPART_SESSION_TTL:-24h}
      PIPEFORGE_MULTIPART_URL_TTL: ${PIPEFORGE_MULTIPART_URL_TTL:-15m}
      PIPEFORGE_MULTIPART_COMPLETION_GRACE: ${PIPEFORGE_MULTIPART_COMPLETION_GRACE:-1h}
      PIPEFORGE_MULTIPART_CLEANUP_LIMIT: ${PIPEFORGE_MULTIPART_CLEANUP_LIMIT:-100}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/go-api.Dockerfile
    profiles: [tools]
    entrypoint: ["/usr/local/bin/pipeforge-migrate"]
    environment:
      PIPEFORGE_ENV: ${PIPEFORGE_ENV:-development}
      PIPEFORGE_LOG_LEVEL: ${PIPEFORGE_LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.1
    profiles: [monitoring]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pipeforge-prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [monitoring]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-pipeforge-local-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - pipeforge-grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  pipeforge-postgres-data:
  pipeforge-rabbitmq-data:
  pipeforge-minio-data:
  pipeforge-prometheus-data:
  pipeforge-grafana-data:
